name: orbitx-push-one-shot

# Temporary bridge: the sandbox that built this change cannot authenticate to
# GitHub, so this runner (which has its own scoped GITHUB_TOKEN) applies a
# checksum-verified thin bundle onto main, restores the two native AARs that
# are too large to bundle, and then deletes itself.
#
on: workflow_dispatch

permissions:
  contents: write

jobs:
  push-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "remote main before = $(git rev-parse refs/remotes/origin/main)"

      - name: Download the bundle
        run: |
          curl -sSL --fail -o /tmp/orbitx_push.bundle \
            "https://static.teamily.ai/sites/7186d2ce-ec44-426f-a09d-bdf44b9ca9ed/documents/orbitx-push/orbitx_push.bundle"
          ls -la /tmp/orbitx_push.bundle

      - name: Verify checksum
        run: |
          echo "83e0202ecc37614cae32692a4021b69334b1d0386f3143d4783651a3d912c953  /tmp/orbitx_push.bundle" | sha256sum -c -

      - name: Verify bundle signature
        run: git bundle verify /tmp/orbitx_push.bundle

      - name: Fast-forward main onto the rebuilt history
        run: |
          git fetch --no-tags /tmp/orbitx_push.bundle \
            f8185ad819b9cc1b1bc6bddf255cee8aae3d3e68:refs/heads/orbitx-new-main
          # --force-with-lease makes this fail loudly rather than clobber if
          # main moved since the bundle was cut.
          git push --force-with-lease=refs/heads/main:b96d065f38d0a81298c31ff73e39ccb49395459f \
            origin refs/heads/orbitx-new-main:refs/heads/main

      - name: Restore the native AARs from repository history
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout -B orbitx-main refs/remotes/origin/main
          mkdir -p android/orbitx_launcher/libs
          # The two AARs carry the LWJGL and OpenAL runtime natives. They already
          # exist in this repository's history (commit 6a7941e) and are
          # restored by blob id: the thin bundle left them out to stay small.
          git cat-file blob e2649d36addc2b40e38bdee7077eeb2051b53acf > android/orbitx_launcher/libs/lwjgl3-natives-release.aar
          git cat-file blob c784e86c58356b1c23ef670889f13f895261de4f > android/orbitx_launcher/libs/openal-soft-release.aar
          echo "37054aefc9503d13ee7ab06cec586537261e7f5836e0f5f52316b6e24cf66b10  android/orbitx_launcher/libs/lwjgl3-natives-release.aar" | sha256sum -c -
          echo "45e630695b6b4c6506704330bf4da80a605b445ea5d187d7b71a370aab5494ea  android/orbitx_launcher/libs/openal-soft-release.aar" | sha256sum -c -
          ls -la android/orbitx_launcher/libs

      - name: Commit the restored natives
        run: |
          git config user.name "VenZ9"
          git config user.email "nityanandaupadhyay70@users.noreply.github.com"
          git add android/orbitx_launcher/libs
          git commit -m "build(android): restore the LWJGL and OpenAL native AARs" || echo "already present"
          git push origin HEAD:main

      - name: Confirm the remote state
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "=== main is now ==="
          git rev-parse refs/remotes/origin/main
          echo "=== last 4 commits ==="
          git log --oneline -4 refs/remotes/origin/main
          echo "=== ORBIT token system present ==="
          git cat-file -e refs/remotes/origin/main:android/orbitx_launcher/src/main/res/values/orbit_design.xml && echo "orbit_design.xml: yes"
          echo "=== csclient entries remaining (expect 0) ==="
          git ls-tree -r --name-only refs/remotes/origin/main | grep -c "csclient" || true
          echo "=== native AAR files present ==="
          git ls-tree -r --name-only refs/remotes/origin/main | grep "orbitx_launcher/libs/"

      - name: Remove this workflow file from main
        continue-on-error: true
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout -B orbitx-cleanup refs/remotes/origin/main
          git rm -q --ignore-unmatch .github/workflows/orbitx-push.yml
          git config user.name "VenZ9"
          git config user.email "nityanandaupadhyay70@users.noreply.github.com"
          git commit -m "chore(ci): remove the temporary push bridge" || echo "nothing to remove"
          git push origin HEAD:main
          echo "=== final main ==="
          git rev-parse HEAD