name: Build Android APK

# Builds the ORBITX debug APK. The Gradle project lives in android/ (the repo root is a
# web/tooling project), so every Gradle step runs with working-directory: android.
on:
  push:
    # main is the published gate. arena/** are the sandbox working branches:
    # a push there builds the same verified APK and refreshes the rolling
    # debug release so a tester can flash it without a merge.
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: orbitx-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .gitmodules lists MobileGlues / SDL / sdl2-compat / fs-manager-udroid, but the
          # repository records no gitlink entries for them (git ls-files -s shows no mode
          # 160000), so there is nothing for checkout to initialise. Their sources are not
          # needed anyway: the launcher consumes their build outputs (assets/components/*)
          # and the jni/ tree that is committed directly.
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle/caches (every Maven resolution, incl. the ~245 MB of LWJGL
      # natives) and the Gradle build cache, keyed on the build scripts. This is what makes
      # a re-run cheap: the native download and the whole dependency graph are reused.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # The NDK version is read out of the module's own build.gradle rather than written
      # down a second time here, so CI cannot drift from the project (currently
      # 27.3.13750724, required by the externalNativeBuild ndkBuild step).
      - name: Install the SDK packages and NDK the project pins
        run: |
          set -euo pipefail
          NDK=$(grep -m1 'ndkVersion' android/orbitx_launcher/build.gradle \
                | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)
          if [ -z "${NDK:-}" ]; then
            echo "::error::could not read ndkVersion from android/orbitx_launcher/build.gradle"
            exit 1
          fi
          echo "Project pins NDK $NDK"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            platform-tools \
            'cmake;3.22.1' \
            "ndk;$NDK"
          echo "NDK_VERSION=$NDK" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          ls -1 "$ANDROID_HOME/ndk"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      # AAPT2 parses resource XML with XMLStreamReader, which enforces the XML rule that a
      # comment body may not contain '--'. The ORBIT Desktop banners draw ASCII box art
      # (+-----+, | ... |, +-----+) inside comments, and those hyphen rules are a hard
      # mergeDebugResources failure -- not a warning -- that stops the build before a single
      # Java file is compiled. It has already happened once on main. Failing here in seconds
      # with a file:line beats decoding an AAPT2 stack trace.
      - name: Guard resource XML comments
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, xml.parsers.expat
          root = pathlib.Path('android/orbitx_launcher/src/main/res')
          comment = re.compile(r'<!--.*?-->', re.DOTALL)
          bad = []
          for p in sorted(root.rglob('*.xml')):
              t = p.read_text(encoding='utf-8', errors='replace')
              for m in comment.finditer(t):
                  body = m.group(0)[4:-3]
                  if '--' in body or body.endswith('-'):
                      bad.append(f'{p}:{t.count(chr(10), 0, m.start()) + 1}')
              # Judge with a parser that enforces the same rule AAPT2 does, rather than
              # trusting the pattern match to have found everything.
              parser = xml.parsers.expat.ParserCreate()
              try:
                  parser.Parse(t, True)
              except xml.parsers.expat.ExpatError as exc:
                  where = f'{p}:{exc.lineno}'
                  if where not in bad:
                      bad.append(f'{where} ({exc})')
          if bad:
              print('::error::resource XML that AAPT2 will reject:')
              for b in bad:
                  print('   ', b)
              print('Fix: replace the hyphen runs inside comment bodies with equal-length "=" runs.')
              sys.exit(1)
          print('Resource XML comments clean; every file parses.')
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # This is where the LWJGL natives arrive. They are ~20 MB of ARM binaries per version
      # and are deliberately not committed; the module's own fetchLwjglNatives task pulls
      # them from Maven Central, deriving each version from the shipped
      # assets/components/lwjgl3/<ver>/lwjgl.jar so the native and Java revisions cannot
      # drift. That task is wired into merge*Assets/preBuild and would run anyway -- it is
      # invoked explicitly here so a download failure surfaces as a fetch error instead of
      # a confusing packaging error at the end of the build.
      - name: Fetch the LWJGL natives (not committed, pulled at build time)
        working-directory: android
        run: ./gradlew --no-daemon :orbitx_launcher:fetchLwjglNatives

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=orbitx_launcher/build/outputs/apk/debug/orbitx_launcher-debug.apk
          test -f "$APK" || { echo "::error::expected APK not found at $APK"; ls -R orbitx_launcher/build/outputs 2>/dev/null || true; exit 1; }
          ls -la "$APK"
          unzip -t "$APK" > /dev/null
          echo "shared objects in APK: $(unzip -l "$APK" | grep -c '[.]so$')"
          unzip -l "$APK" | grep -q libpojavexec.so
          unzip -l "$APK" | grep -q libmobileglues.so
          unzip -l "$APK" | grep -q libltw.so
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E '^package|^application-label:' || true

          # ── LWJGL natives guard ──────────────────────────────────────────────
          # This is the check that was missing when the game crashed on device with
          # UnsatisfiedLinkError at the renderer bind.
          #
          # The launcher does not load LWJGL from lib/; it extracts the .so files from
          # assets/components/lwjgl-<ver>-natives/<abi>/ and points LD_LIBRARY_PATH at them.
          # Two independent failures can reach the user while every other check stays green:
          #
          #   1. the payload is not in the APK at all (wrong asset path, or the natives were
          #      never fetched);
          #   2. the payload is present but was built from a different LWJGL revision than
          #      the bundled lwjgl.jar, so the Java side binds a JNI entry point the .so does
          #      not export and the game dies on the first frame.
          #
          # Asserting the file exists only catches (1). Catching (2) needs the symbol.
          rm -rf /tmp/apkx && mkdir -p /tmp/apkx
          unzip -q "$APK" 'assets/components/lwjgl-*-natives/*' -d /tmp/apkx

          # The JNI entry point differs by revision: 3.3.x binds nsetupEnvData, 3.4.x binds
          # setupEnvData. Ask each version for the symbol its own bundled lwjgl.jar binds, or
          # this guard would reject a correct build. The ABI library lists differ too.
          guard_version() {
            ver=$1; sym=$2; shift 2
            for abi in arm64-v8a armeabi-v7a; do
              D=/tmp/apkx/assets/components/lwjgl-$ver-natives/$abi
              if [ ! -d "$D" ]; then
                echo "::error::LWJGL $ver natives for $abi are not packaged — the game would fail to start"
                exit 1
              fi
              for so in "$@"; do
                if [ ! -s "$D/$so" ]; then
                  echo "::error::LWJGL $ver/$abi is missing $so"
                  exit 1
                fi
              done
              if ! grep -aq "$sym" "$D/liblwjgl.so"; then
                echo "::error::LWJGL $ver/$abi liblwjgl.so does not export $sym — these natives were built from a different LWJGL revision than the bundled lwjgl.jar, so the game would crash with UnsatisfiedLinkError at the renderer bind."
                exit 1
              fi
              echo "OK  lwjgl-$ver/$abi  ($(du -sh "$D" | cut -f1), $sym present)"
            done
          }

          guard_version 3.3.3 nsetupEnvData \
            liblwjgl.so liblwjgl_opengl.so liblwjgl_stb.so liblwjgl_tinyfd.so \
            liblwjgl_vma.so liblwjgl_nanovg.so libfreetype.so libshaderc.so
          guard_version 3.4.1 setupEnvData \
            liblwjgl.so liblwjgl_opengl.so liblwjgl_stb.so liblwjgl_tinyfd.so \
            liblwjgl_vma.so liblwjgl_nanovg.so liblwjgl_spng.so libfreetype.so libshaderc.so
          guard_version 3.4.2 setupEnvData \
            liblwjgl.so liblwjgl_opengl.so liblwjgl_stb.so liblwjgl_tinyfd.so \
            liblwjgl_vma.so liblwjgl_nanovg.so liblwjgl_spng.so libfreetype.so libshaderc.so

          # The mismatched natives AAR that caused the crash shipped liblwjgl.so into lib/.
          # That file made every other check pass while the launcher loaded the broken pair,
          # so it must never come back.
          if unzip -l "$APK" | grep -qE 'lib/[^/]+/liblwjgl\.so'; then
            echo "::error::liblwjgl.so is packaged in lib/ again — a stale LWJGL natives AAR has been reintroduced. LWJGL must only ship as versioned assets."
            exit 1
          fi
          echo "LWJGL natives guard passed"
          sha256sum "$APK"

      # if: always() so a red build still yields whatever APK was produced.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbitx_launcher-debug
          path: android/orbitx_launcher/build/outputs/apk/debug/orbitx_launcher-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/build/reports/
            android/orbitx_launcher/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      # Gated on success() and non-PR so a broken or unreviewed build never replaces the
      # published APK.
      - name: Publish APK to the rolling debug release
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/orbitx_launcher/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          TAG=orbitx-debug-latest
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title 'ORBITX debug build (rolling)' \
              --notes 'Rolling debug APK, rebuilt on every push to main.' --prerelease
          gh release upload "$TAG" "$APK" --clobber
          echo "Published $APK to release $TAG"
