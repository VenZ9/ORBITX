name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: orbitx-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install SDK packages and the NDK the project pins
        run: |
          set -euo pipefail
          NDK=$(grep -m1 ndkVersion android/orbitx_launcher/build.gradle | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)
          if [ -z $NDK ]; then echo '::error::could not read ndkVersion'; exit 1; fi
          echo Project requires NDK $NDK
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' platform-tools 'cmake;3.22.1' 'ndk;'$NDK
          echo NDK_VERSION=$NDK >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          java -version
          ls -1 $ANDROID_HOME/ndk
          test -d $ANDROID_HOME/ndk/$NDK_VERSION

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find orbitx_launcher/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n $APK
          ls -la $APK
          unzip -t $APK > /dev/null
          unzip -l $APK | grep -c '[.]so$'
          unzip -l $APK | grep -q libpojavexec.so
          unzip -l $APK | grep -q libmobileglues.so
          unzip -l $APK | grep -q libltw.so
          # ── OrbitX runtime-native guard ──────────────────────────────────
          # liblwjgl.so and libopenal.so come from the two AARs in
          # orbitx_launcher/libs/. They were lost once in a base swap and the
          # games hosted in the app died at window creation
          # ("Could not initialize class org.lwjgl.glfw.GLFW").
          # This step makes that class of regression impossible to ship again.
          for lib in liblwjgl.so liblwjgl_opengl.so liblwjgl_stb.so libopenal.so; do
            for abi in arm64-v8a armeabi-v7a; do
              if ! unzip -l $APK | grep -q "lib/$abi/$lib"; then
                echo "::error::MISSING RUNTIME NATIVE lib/$abi/$lib - the app would crash on launch. Check orbitx_launcher/libs/*.aar"
                exit 1
              fi
            done
          done
          test -d orbitx_launcher/libs || { echo '::error::orbitx_launcher/libs is missing'; exit 1; }
          ls -la orbitx_launcher/libs
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging $APK | grep -E '^package|^application-label:'
          sha256sum $APK

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitx-launcher-debug
          path: android/orbitx_launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the rolling debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/orbitx_launcher/build/outputs/apk/debug -name '*.apk' -print -quit)
          TAG=orbitx-debug-latest
          gh release view $TAG > /dev/null 2>&1 || gh release create $TAG --title 'ORBITX debug build (rolling)' --notes 'Rolling debug APK, rebuilt on every push to main.' --prerelease
          gh release upload $TAG $APK --clobber
          echo Done
