name: orbitx-cleanup

# Retire the temporary push bridge. The bridge did its job: main now carries the
# ORBIT rebuild plus the restored natives, and the debug APK build ran green off
# it. This workflow removes the bridge file itself and neutralises the embedded
# artifact token that lived in its Download step, then deletes itself.
#
# It touches only .github/workflows/orbitx-push.yml -- a file that already exists
# in the repository -- so the default Actions token is allowed to push it.

on:
  push:
    paths:
      - '.github/workflows/orbitx-cleanup.yml'

permissions:
  contents: write

jobs:
  retire-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the bridge and itself
        run: |
          git config user.name  "orbitx-bridge"
          git config user.email "orbitx-bridge@users.noreply.github.com"
          for f in .github/workflows/orbitx-push.yml \
                   .github/workflows/orbitx-cleanup.yml \
                   .github/workflows/orbitx-push2.yml \
                   .github/workflows/orbitx-push-one-shot.yml; do
            [ -f "$f" ] && git rm -f "$f" || true
          done
          git rm -r --ignore-unmatch .orbitx-bridge .orbitx-bridge2 || true
          git diff --cached --stat
          git commit -m "chore(ci): retire the temporary push bridge and its embedded token"
          git push origin main
          echo "remaining workflows:"
          ls -1 .github/workflows
