name: cdn-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe relay reachability (exit 1 if unreachable)
        run: |
          CODE=$(curl -sS -o /tmp/a -w "%{http_code}" -L "https://litter.catbox.moe/zvhn1g.gz" || echo "000")
          SIZE=$(wc -c < /tmp/a 2>/dev/null || echo 0)
          echo "relay http=$CODE size=$SIZE"
          if [ "$CODE" = "200" ] && [ "$SIZE" -gt 10000 ]; then
            echo "RESULT=PASS relay reachable"
            exit 0
          fi
          echo "RESULT=FAIL relay not reachable"
          exit 1
