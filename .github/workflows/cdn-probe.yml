name: cdn-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe our CDN and a public control
        run: |
          echo "--- artifact CDN (private, token required?) ---"
          curl -sS -o /dev/null -w "cdn code=%{http_code} size=%{size_download}\n" -L "https://static.teamily.ai/files/ae31b43c-219a-4abe-aa0e-ad224972caba/build.gradle" || echo "cdn curl failed"
          echo "--- public control ---"
          curl -sS -o /dev/null -w "ctl code=%{http_code} size=%{size_download}\n" -L "https://raw.githubusercontent.com/VenZ9/ORBITX/main/README.md" || echo "ctl curl failed"
