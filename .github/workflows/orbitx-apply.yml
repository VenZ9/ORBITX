name: orbitx-apply
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and verify the change set
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/fix.gz "https://litter.catbox.moe/tsyzch.gz"
          echo "5e16218b797df9f7b7084f205ed920913b73b550055db22c777f42a49ec9e675  /tmp/fix.gz" | sha256sum -c -
          gunzip -c /tmp/fix.gz > /tmp/fix.patch
          echo "58c23801c3a2a5352d5b756add235cab1d13e44fa11d41f314184cfb906de3de  /tmp/fix.patch" | sha256sum -c -
          grep -c '^diff --git' /tmp/fix.patch
          echo "--- context check: the files to patch must still be at their expected state ---"
          git apply --check --whitespace=nowarn /tmp/fix.patch
          echo "base=$(git rev-parse --short HEAD)"

      - name: Apply the change set
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn /tmp/fix.patch
          git rm -q android/orbitx_launcher/libs/lwjgl3-natives-release.aar
          echo "--- asserts ---"
          grep -q "fetchLwjglNatives" android/orbitx_launcher/build.gradle
          grep -q "nsetupEnvData" .github/workflows/android-build.yml
          grep -q "applyDrawerPullVisibility" android/orbitx_launcher/src/main/java/net/kdt/pojavlaunch/MainActivity.java
          grep -q "extractLwjglNativesNow" android/orbitx_launcher/src/main/java/net/kdt/pojavlaunch/Tools.java
          grep -q "nsetupEnvData" android/orbitx_launcher/src/main/java/net/kdt/pojavlaunch/tasks/AsyncAssetManager.java
          test "$(grep -c 'CSLauncher' android/orbitx_launcher/src/main/java/com/kdt/LoggerView.java || true)" -eq 0
          echo "--- staged ---"
          git status --porcelain

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.email "orbitx@teamily.ai"
          git config user.name "ORBITX Build Agent"
          git commit -q \
            -m "fix(launcher): ship working LWJGL natives, wire the in-game handle option, fix the recorder, rebuild the shell" \
            -m "Crash root cause: the game died with UnsatisfiedLinkError at the renderer bind because the packaged liblwjgl.so was built from a different LWJGL revision than the lwjgl.jar on the classpath. The shipped AAR's liblwjgl.so does not export nsetupEnvData, the JNI entry point lwjgl.jar 3.3.3's ThreadLocalUtil binds. Compounding it, the extraction routine read from an asset path that does not exist in the APK, so AssetManager.list threw, the component job aborted, and because the caller only logs, the launcher still started with an empty natives directory. The version file was then written anyway, so later launches skipped re-extraction and the directory stayed empty." \
            -m "Fix: drop the mismatched natives AAR; fetch the natives at build time from Maven Central using the version directories this module actually ships so the native revision cannot drift from the jar, verifying each liblwjgl.so for the symbol its own jar binds; read from the real asset path, clear stale directories, verify the full .so set and publish the version file only after verification; re-extract synchronously at launch when the directory is empty or incomplete; and add a CI guard asserting every required .so and the correct JNI symbol per ABI, failing if liblwjgl.so ever reappears in lib/." \
            -m "Recorder: the MediaProjection was obtained before its foreground service was running, which Android 14+ rejects, so every capture failed behind a generic toast. Start the service first, then take the projection. Audio is now best-effort so a denied microphone permission degrades to a silent clip instead of no clip." \
            -m "In-game handle: the hide preference existed but three setVisibility(VISIBLE) calls re-showed the handle, so the option appeared to do nothing. All call sites now route through one accessor that respects the preference and the boot overlay. Log branding: the game log rendered a vector two-letter product mark, which is the CS that leaked into the log screen; the slot now shows the launcher's own ring mark." \
            -m "Shell: replace the copied left icon rail with ORBITX's own bottom command bar, selection carried by shape and an outer-edge spine, action glyphs in a right-hand stack, account and settings in the bar's trailing edge. View IDs preserved so existing activity bindings are untouched."
          git push origin HEAD:main
          echo "--- pushed ---"
          git log --oneline -2
