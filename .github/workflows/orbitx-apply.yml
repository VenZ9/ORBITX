name: orbitx-apply
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and verify the change set
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/fix.gz "https://litter.catbox.moe/17nyx0.gz"
          echo "6e30b3a8381f3a26e8731c46244787f1a281cf9f23487414b85c33ea86d47256  /tmp/fix.gz" | sha256sum -c -
          gunzip -c /tmp/fix.gz > /tmp/fix.patch
          echo "3010ee74d98d52bf2cbd9aa89544ef0e42f8d3d1cfdb53f38ec022ee86061efa  /tmp/fix.patch" | sha256sum -c -
          git apply --check --whitespace=nowarn /tmp/fix.patch

      - name: Apply, assert and push
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn /tmp/fix.patch
          grep -q 'android:id="@+id/lh_nav_settings"' android/orbitx_launcher/src/main/res/layout/include_lh_dock.xml
          grep -q 'R.id.lh_nav_settings' android/orbitx_launcher/src/main/java/net/kdt/pojavlaunch/LauncherActivity.java
          python3 -c "import xml.dom.minidom;xml.dom.minidom.parse('android/orbitx_launcher/src/main/res/layout/include_lh_dock.xml')"
          git status --porcelain
          git config user.email "orbitx@teamily.ai"
          git config user.name "ORBITX Build Agent"
          git commit -q -m "fix(launcher): restore the settings destination in the bottom command bar" -m "LauncherActivity resolves R.id.lh_nav_settings twice - once to wire the click handler and once in setDockSelected. Rebuilding the dock as a bottom command bar dropped that view, so the resource id no longer existed and compilation failed. The Settings page is reachable only through this id, so removing it broke navigation as well as the build. Add it back as the bar's fifth destination, laid out like the other four."
          git push origin HEAD:main
          git log --oneline -2
