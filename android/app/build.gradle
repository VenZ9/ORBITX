plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The native EGL/GLFW-JNI bridge (cpp/) is only compiled when an NDK is available
// and the build is invoked with -Porbitx.native=true. The Kotlin launcher core builds
// and runs without it, but a real Minecraft session requires it.
def buildNative = project.hasProperty('orbitx.native')

android {
    namespace 'com.orbitx.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.orbitx.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    if (buildNative) {
        externalNativeBuild {
            cmake {
                path file('cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Note: androidx.compose.material:material-icons-extended is deliberately NOT used.
    // It is a very large module and only a handful of core icons are needed here.

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Used to unpack the Android OpenJDK runtimes, which are published as .tar.xz
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
    implementation 'commons-io:commons-io:2.16.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
