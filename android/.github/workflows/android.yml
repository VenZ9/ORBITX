name: OrbitX Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  BuildDebug:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [ "arm64", "arm32" ]
      fail-fast: false

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build the JRE / LWJGL3 support module
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Assemble OrbitX (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew orbitx_launcher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Debug-${{ matrix.variant }}
          path: android/orbitx_launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
