plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Show clean "ORBITX v3.1" style version names.
    String semVer = "3.2.0"
    
    // Try to get a git tag for the full version
    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace();
        }
    }
    
    String tagStr = TAG.toString().trim()
    if (!tagStr.isEmpty()) {
        if (tagStr ==~ /^v?\d+(?:\.\d+)*.*/) {
            return tagStr
        }
    }
    
    return "v" + semVer
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (project.hasProperty("signingKeystore") && new File(project.property("signingKeystore")).exists()) {
                storeFile file(project.property("signingKeystore"))
                storePassword project.property("signingStorePassword")
                keyAlias project.property("signingKeyAlias")
                keyPassword project.property("signingKeyPassword")
            } else {
                storeFile file("release.keystore")
                storePassword "cslauncher2026"
                keyAlias "cslauncher"
                keyPassword "cslauncher2026"
            }
        }
    }

    defaultConfig {
        applicationId "com.orbitx.launcher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10020000
        versionName getVersionName()
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }

        // ── APK slimming ────────────────────────────────────────────────
        // x86 / x86_64 only exist for emulators and a handful of Chromebooks, yet they cost
        // ~60 MB of the release APK (native libs + LWJGL natives + the x86 JRE tarballs).
        // Build with -PkeepX86=true to put them back.
        if (!(project.findProperty("keepX86") ?: "false").toBoolean()) {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "ORBITX"
            resValue "string", "app_short_name", "ORBITX"
            resValue 'string', 'application_package', 'com.orbitx.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.orbitx.launcher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.orbitx.launcher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Do not enable minification — it obfuscates java.awt classes.
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            signingConfig signingConfigs.release
            resValue "string", "app_name", "ORBITX"
            resValue "string", "app_short_name", "ORBITX"
            resValue 'string', 'storageProviderAuthorities', 'com.orbitx.launcher.gamefolder'
            resValue 'string', 'application_package', 'com.orbitx.launcher'
        }
        gplay {
            initWith release
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

afterEvaluate {
    // Explicit dependencies for which the apk relies on
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
    tasks.mergeReleaseAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
}

dependencies {
    // Core utility libraries
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'org.apache.commons:commons-compress:1.24.0'
    implementation 'net.objecthunter:exp4j:0.4.8'
    implementation 'org.jdom:jdom2:2.0.6.1'

    // OrbitX is self-contained: no Firebase / remote admin panel dependencies.
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    // implementation 'com.wu-man:android-bsf-api:3.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.palette:palette:1.0.0'
    // Required for ShortcutManagerCompat / IconCompat used by the home screen
    // shortcut system (net.kdt.pojavlaunch.shortcuts). Gives us one API that
    // covers the legacy broadcast path (21-24) and requestPinShortcut (25+).
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'

    // implementation 'com.intuit.sdp:sdp-android:1.0.5'
    // implementation 'com.intuit.ssp:ssp-android:1.0.5'

    implementation 'org.tukaani:xz:1.8'
    // Our version of exp4j can be built from source at
    // https://github.com/PojavLauncherTeam/exp4j
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'
    // Animated GIF support for profile backgrounds (native decoder, memory-efficient)
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
    implementation 'com.caverock:androidsvg-aar:1.4'

    // implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'

    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation "net.java.dev.jna:jna:5.13.0@aar"
    implementation 'com.google.android.material:material:1.12.0'
}


// ══ LWJGL natives: fetched from the SAME Maven version as the bundled jars ══
// assets/components/lwjgl3/<ver>/lwjgl.jar (the Java classes the game loads) must
// have its native counterpart in assets/components/lwjgl-<ver>-natives/<abi>/.
// Shipping one without the other is exactly what crashed the game on device: a
// liblwjgl.so built from a different LWJGL revision does not export the JNI entry
// point the Java side binds, and the game dies with UnsatisfiedLinkError the
// moment the renderer comes up.
//
// The native libraries are ~20 MB of ARM binaries, so they are not committed.
// They are pulled from Maven Central here, at build time, using the version
// directories this module actually ships. The version cannot drift, because it is
// read from the shipped jars rather than written down a second time — and each
// downloaded liblwjgl.so is checked for the symbol its own lwjgl.jar binds,
// failing the build rather than the game.
//
// Build with -PofflineLwjgl=true to skip the fetch when the .so files are already
// in place (e.g. a warm CI cache).
def lwjglAssetsComponents = file('src/main/assets/components')
// ABI directory -> Maven natives classifier
def lwjglAbiClassifiers = ['arm64-v8a': 'linux-arm64', 'armeabi-v7a': 'linux-arm32']
// The JNI entry point ThreadLocalUtil binds, per LWJGL major line.
def lwjglSymbolFor = { String ver -> ver.startsWith('3.4') ? 'setupEnvData' : 'nsetupEnvData' }
def lwjglModulesFor = { String ver ->
    def mods = ['lwjgl', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd',
                'lwjgl-vma', 'lwjgl-nanovg', 'lwjgl-freetype', 'lwjgl-shaderc']
    // 3.4.x additionally ships liblwjgl_spng.so for its STB/PNG path.
    if (ver.startsWith('3.4')) mods.add('lwjgl-spng')
    mods
}

tasks.register('fetchLwjglNatives') {
    description = 'Fetch the LWJGL native libraries matching the shipped lwjgl3/<ver> jars.'
    group = 'orbitx'
    outputs.upToDateWhen { false }

    doLast {
        // The versions come from what this module actually ships — never a
        // hand-written list that could disagree with the classpath.
        def lwjgl3Root = new File(lwjglAssetsComponents, 'lwjgl3')
        def versions = (lwjgl3Root.listFiles() ?: [] as File[])
                .findAll { it.isDirectory() && new File(it, 'lwjgl.jar').isFile() }
                .collect { it.name }
                .sort()
        if (versions.isEmpty()) {
            throw new GradleException("No lwjgl3/<version>/lwjgl.jar found under ${lwjgl3Root}")
        }
        logger.lifecycle("LWJGL versions shipped by this module: ${versions.join(', ')}")

        boolean offline = (project.findProperty('offlineLwjgl') ?: 'false').toBoolean()
        def tmpDir = new File(buildDir, 'lwjgl-natives-download')
        tmpDir.mkdirs()

        def failures = []
        versions.each { ver ->
            def symbol = lwjglSymbolFor(ver)
            lwjglAbiClassifiers.each { abi, classifier ->
                def targetDir = new File(lwjglAssetsComponents, "lwjgl-${ver}-natives/${abi}")
                def probe = new File(targetDir, 'liblwjgl.so')
                if (probe.isFile() && probe.length() > 0 && new String(probe.bytes, 'ISO-8859-1').contains(symbol)) {
                    logger.lifecycle("  lwjgl-${ver}/${abi} already present and verified")
                    return
                }
                if (offline) {
                    failures << "lwjgl-${ver}/${abi} missing and offlineLwjgl=true"
                    return
                }
                targetDir.mkdirs()
                lwjglModulesFor(ver).each { mod ->
                    def jarName = "${mod}-${ver}-natives-${classifier}.jar"
                    def jarFile = new File(tmpDir, jarName)
                    if (!jarFile.isFile() || jarFile.length() == 0) {
                        def url = "https://repo1.maven.org/maven2/org/lwjgl/${mod}/${ver}/${jarName}"
                        try {
                            ant.get(src: url, dest: jarFile, retries: 3, ignoreerrors: false)
                        } catch (Exception e) {
                            throw new GradleException("Could not download ${url}: ${e.message}", e)
                        }
                    }
                    // A natives jar holds the .so files somewhere under the archive root.
                    // Flatten them into the ABI directory so the launcher's asset path stays
                    // a simple lwjgl-<ver>-natives/<abi>/<lib>.so.
                    copy {
                        from zipTree(jarFile)
                        include '**/*.so'
                        eachFile { fcd -> fcd.path = fcd.name }
                        includeEmptyDirs = false
                        into targetDir
                    }
                }
                // Verify what we just placed, not just that a file exists.
                def required = lwjglModulesFor(ver).collectMany { mod ->
                    def jarFile = new File(tmpDir, "${mod}-${ver}-natives-${classifier}.jar")
                    zipTree(jarFile).matching { include '**/*.so' }.files.collect { it.name }
                }
                required.each { so ->
                    def f = new File(targetDir, so)
                    if (!f.isFile() || f.length() == 0) failures << "lwjgl-${ver}/${abi} missing ${so}"
                }
                if (probe.isFile() && !new String(probe.bytes, 'ISO-8859-1').contains(symbol)) {
                    failures << "lwjgl-${ver}/${abi} liblwjgl.so does not export ${symbol} (wrong LWJGL revision)"
                }
                logger.lifecycle("  fetched lwjgl-${ver}/${abi} (${required.size()} libraries, ${symbol} present)")
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("LWJGL natives are unusable; the game would crash with " +
                    "UnsatisfiedLinkError:\n  - " + failures.join('\n  - '))
        }
    }
}

tasks.configureEach { t ->
    if ((t.name.startsWith('merge') && t.name.endsWith('Assets')) || t.name.startsWith('preBuild')) {
        t.dependsOn('fetchLwjglNatives')
    }
}