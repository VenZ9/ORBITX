# OrbitX build settings — memory-fitted for a hard 2048 MB cgroup with NO swap.
#
# This is a large project (483 Kotlin/Java sources, 160 MB of bundled JRE assets,
# 241 MB of prebuilt .so files, and a ~157 MB APK to package).  Upstream ships
# -Xmx4096M, which gets the daemon OOM-killed within seconds.
#
# Tuning notes, all measured in this container by sampling the cgroup:
#   - Only ONE JVM does the work (the Gradle daemon, compiling Kotlin in-process).
#     Its RSS passes 1.4 GB, and the cgroup total must stay under 2048 MB — about
#     280 MB of that is the surrounding runtime, so the build has ~1.7 GB to work
#     with and is genuinely close to the line.
#   - MaxMetaspaceSize must stay >= 256m: at 176m the compile dies with
#     "Self-suppression not permitted / Metaspace".
#   - CompressedClassSpaceSize is capped because its 1 GB default reservation
#     inflates committed memory on a 64-bit JVM.
#   - TieredStopAtLevel=1 keeps the C2 JIT server compiler out of the picture.
#     A build JVM gains almost nothing from it and it costs real memory.
#   - Direct memory must NOT be capped tightly.  APK packaging (zipflinger) reads
#     each entry into a direct ByteBuffer, and the largest bundled .so
#     (libOSMesa_2121.so) is 18.9 MB.  Capping this at 96m made packageDebug fail
#     with "Cannot reserve 18927952 bytes of direct buffer memory".  This is a
#     ceiling, not a reservation, so it costs nothing until used.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=48m -XX:CompressedClassSpaceSize=96m -XX:MaxDirectMemorySize=768m -Xss640k -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Compile Kotlin in-process so no second compiler JVM is started.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.configureondemand=true

android.useAndroidX=true
# Jetifier rewrites every dependency bytecode-by-bytecode: a large memory and time
# cost.  Every dependency here is already AndroidX, so it is off to stay inside the
# container's memory cap.
android.enableJetifier=false
android.bundle.language.enableSplit=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
