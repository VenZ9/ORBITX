# required for building jre_lwjgl3glfw with Java 8 while using plugins in app_pojavlauncher that require Java 11
org.gradle.configureondemand=true

android.useAndroidX=true
android.bundle.language.enableSplit=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.aapt2FromPlaystore=false

# Keep the whole toolchain (Gradle + Kotlin + R8 + aapt2) inside a 2 GB cgroup.
#
# The limit is a hard cgroup cap: exceeding it raises no Java OutOfMemoryError, the
# kernel just SIGKILLs the daemon and Gradle reports only "Gradle build daemon
# disappeared unexpectedly". The observed kill was at mergeExtDexDebug (dexing from
# scratch) with the cgroup pinned at 2047 MB of 2048 MB, so the footprint has to be a
# budget that is spent deliberately:
#
#   heap 1152 + metaspace 320 + code cache 64 + direct 96 + native/threads ~30
#   = ~1660 MB, plus the single-use launcher JVM = ~1760 MB.
#
# ActiveProcessorCount is as important as the sizes. The host exposes 64 CPUs while the
# cgroup grants one (cpu.max 100000 100000), so left alone the JVM sizes its JIT compiler
# threads, GC helpers and fork-join pools for 64 cores and spends memory and threads the
# build is never allowed to use. Pinning it to the real CPU budget is what keeps a cold
# build inside the cap.
#
# Do not raise -Xmx without re-checking the total: the failure mode is a killed build
# with no useful message, not a clean OOM.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=96m -XX:ActiveProcessorCount=1 -XX:ThreadStackSize=512 -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
# No resident daemon and no native file-watcher: both cost memory we do not have.
org.gradle.daemon=false
org.gradle.vfs.watch=false
