# The build must stay inside a modest memory budget: CI runners and containers are
# commonly capped around 2 GB, and a heap larger than the cap gets the daemon OOM-killed
# before the first task runs.
org.gradle.jvmargs=-Xmx1408m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:CompressedClassSpaceSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Compiling Kotlin in-process avoids a second, separate compiler JVM: on a container
# with a tight memory cap, the Gradle daemon and the Kotlin daemon together are what
# push the cgroup over the limit.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
